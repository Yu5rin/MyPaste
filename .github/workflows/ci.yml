name: CI

# 自動実行はせず、Actions タブから手動でのみ実行する（workflow_dispatch）。
# 手元に Windows が無いときなどに、EXE を Artifact として取得する用途。
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Lint (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atai-paste-exe
          path: target/release/Atai-paste.exe
          if-no-files-found: error
