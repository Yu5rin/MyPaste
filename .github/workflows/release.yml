name: Release

# 自動実行はせず、Actions タブから手動でのみ実行する（workflow_dispatch）。
# 入力したタグで EXE をビルドし、GitHub Release を作成して添付する。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ（例: v1.0.0）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/Atai-paste.exe dist/Atai-paste.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: アタイの貼り付け ${{ inputs.tag }}
          files: dist/Atai-paste.exe
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
